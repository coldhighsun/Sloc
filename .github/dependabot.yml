version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels: ["dependencies"]
    ignore:
      # Microsoft.Extensions.* major versions track the runtime; stay on the
      # 10.x line to match the net10.0 target framework
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
    groups:
      nuget-minor-patch:
        update-types: ["minor", "patch"]
      nuget-major:
        update-types: ["major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "github-actions"]
    groups:
      github-actions-minor-patch:
        update-types: ["minor", "patch"]
      github-actions-major:
        update-types: ["major"]
