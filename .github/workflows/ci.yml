name: CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore Sloc.slnx

      - name: Build
        run: dotnet build Sloc.slnx --no-restore --configuration Release

      - name: Test
        run: >
          dotnet test Sloc.slnx --no-build --configuration Release
          -- --coverage --coverage-output-format cobertura --results-directory ./coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}
          path: ./coverage/**/*.cobertura.xml
          if-no-files-found: warn

      # Resolves the exact report paths (one per test project) into a comma-separated,
      # glob-free list before handing them to Codecov. A `files` glob is expanded by the
      # shell before Codecov sees it, and that expansion is inconsistent across platforms
      # (Windows' Git Bash expands `**` where Ubuntu's non-interactive bash does not),
      # which broke uploads on Windows; a `directory` input instead relies on Codecov's
      # own report-discovery heuristics, which failed to recognize these GUID-named
      # files at all on every platform. Listing the literal paths sidesteps both.
      - name: Locate coverage reports
        id: coverage
        shell: bash
        run: |
          files=$(find ./coverage -name '*.cobertura.xml' -print0 | xargs -0 | tr ' ' ',')
          echo "files=$files" >> "$GITHUB_OUTPUT"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ${{ steps.coverage.outputs.files }}
          flags: ${{ matrix.os }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  publish:
    name: Publish (${{ matrix.rid }})
    runs-on: ubuntu-latest
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        rid: [win-x64, win-arm64, linux-x64, linux-arm64, osx-x64, osx-arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Publish
        run: >
          dotnet publish src/Sloc.Cli/Sloc.Cli.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --output ./publish/${{ matrix.rid }}

      - name: Zip artifact
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          # Only the executable ships; drop any debug symbols that publish may emit.
          rm -f ./publish/${{ matrix.rid }}/*.pdb
          ZIP_NAME=sloc-${VERSION}-${{ matrix.rid }}.zip
          zip -j ./${ZIP_NAME} ./publish/${{ matrix.rid }}/sloc*
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: sloc-${{ matrix.rid }}
          path: ./${{ env.ZIP_NAME }}

  pack:
    name: Pack & Publish NuGet Tool
    runs-on: ubuntu-latest
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore src/Sloc.Cli/Sloc.Cli.csproj

      - name: Pack
        run: dotnet pack src/Sloc.Cli/Sloc.Cli.csproj --no-restore --configuration Release --output ./artifacts

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: ./artifacts/*.nupkg

      - name: Push to NuGet.org
        run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [pack, publish]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: sloc-*
          path: ./artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Sloc ${{ github.ref_name }}
          files: ./artifacts/*.zip
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
